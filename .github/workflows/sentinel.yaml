name: Sentinel

on:
  pull_request:
    paths:
      - '.gitignore'
      - 'README.md'
      - 'LICENSE'

jobs:
  reject-trespasser:
    runs-on: ubuntu-latest
    steps:
      - name: Auto denial suspicious pullrequests
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "**[Arbiter Bot] ERROR:** This repository has a strict policy regarding important files. Modifying `.gitignore`, `LICENSE`, and 'README.md' via Pull Requests is strictly prohibited. Your PR has been automatically closed."
            });
            
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              state: "closed"
            });
