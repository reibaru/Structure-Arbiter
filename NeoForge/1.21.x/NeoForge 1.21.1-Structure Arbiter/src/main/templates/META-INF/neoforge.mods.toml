modLoader="javafml"
loaderVersion="[4,)"
license="MIT"

[[mods]]
modId="arbiter"
version="${mod_version}"
displayName="Structure Arbiter"
description='''
Stops structure mods from overlapping each other.
Structures are arbitrated per position before they are built: higher-priority structures win,
and the result depends only on the world seed and coordinates, not on load order or exploration order.
'''

[[mixins]]
config="arbiter.mixins.json"

[[dependencies.arbiter]]
modId="neoforge"
type="required"
versionRange="[21.1.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.arbiter]]
modId="minecraft"
type="required"
versionRange="[1.21.1,1.22)"
ordering="NONE"
side="BOTH"
